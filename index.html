<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Corre Gallina! Protege el Huevo</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 26, 46, 0.85);
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
        }
        p {
            font-size: 1.2rem;
            max-width: 500px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
            transition: transform 0.1s ease, background 0.2s;
        }
        .btn:hover {
            background: #ff5252;
        }
        .btn:active {
            transform: scale(0.95);
        }
        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 5;
            pointer-events: none;
            margin-bottom: 30px; 
        }
        .ctrl-btn {
            pointer-events: auto;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid white;
            border-radius: 50%;
            font-size: 2.2rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        #alias-input {
            width: 80%;
            max-width: 400px;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 25px;
            border: 2px solid #ccc;
            font-size: 1.1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="hud-box" id="level-text">Nivel: 1 - Campo Verde</div>
            <div class="hud-box" id="score-text">Distancia: 0m</div>
        </div>

        <div id="ui-overlay">
            <h1>🐔 ¡Corre Gallina!</h1>
            <input type="text" id="alias-input" placeholder="Tu Alias aquí">
            <p>¡Lleva tu preciado huevo en las alas hasta el nido! Salta troncos, agáchate bajo ramas y esquiva al zorro hambriento.</p>
            <button class="btn" id="start-btn">¡JUGAR AHORA!</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="controls">
            <div class="ctrl-btn" id="btn-down">⬇️</div>
            <div class="ctrl-btn" id="btn-up">⬆️</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const overlay = document.getElementById("ui-overlay");
        const startBtn = document.getElementById("start-btn");
        const levelText = document.getElementById("level-text");
        const scoreText = document.getElementById("score-text");
        const aliasInput = document.getElementById("alias-input");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const controls = document.getElementById("controls");
            if (window.innerWidth < window.innerHeight) {
                controls.style.bottom = "30px";
            } else {
                controls.style.bottom = "15px";
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameRunning = false;
        let distance = 0;
        let level = 1;

        const scenarios = [
            { name: "Campo Verde", sky: "#87CEEB", ground: "#55a630", dirt: "#415A77", speed: 5 },
            { name: "Bosque Oscuro", sky: "#2B2D42", ground: "#3A5A40", dirt: "#1D2D44", speed: 6 },
            { name: "Atardecer Naranja", sky: "#FF7B00", ground: "#8B4513", dirt: "#780000", speed: 7 },
            { name: "Noche Helada", sky: "#14213D", ground: "#E5E5E5", dirt: "#334E68", speed: 8 }
        ];

        let currentScenario = scenarios[0];

        let chicken = {
            x: 100,
            y: 0,
            width: 60,
            height: 60,
            vy: 0,
            jumping: false,
            ducking: false,
            animFrame: 0
        };

        let obstacles = [];
        let reachedNest = false;
        let fox = { x: -100, y: 0, width: 70, height: 50 };

        function resetGame() {
            distance = 0;
            currentScenario = scenarios[(level - 1) % scenarios.length];
            obstacles = [];
            reachedNest = false;
            levelText.innerText = `Nivel: ${level} - ${currentScenario.name}`;
            fox.x = -200;
            updateHUD();
        }

        function updateHUD() {
            scoreText.innerText = `Distancia: ${Math.floor(distance)}m`;
        }

        startBtn.addEventListener("click", () => {
            overlay.style.display = "none";
            resetGame();
            gameRunning = true;
            animateChicken();
        });

        function animateChicken() {
            if (!gameRunning) return;
            chicken.animFrame = (chicken.animFrame + 1) % 10;
            setTimeout(animateChicken, 100);
        }

        const btnUp = document.getElementById("btn-up");
        const btnDown = document.getElementById("btn-down");

        btnUp.addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (!gameRunning || reachedNest) return;
            if (!chicken.jumping) {
                chicken.vy = -16;
                chicken.jumping = true;
                chicken.ducking = false;
            }
        }, {passive: false});

        btnDown.addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (!gameRunning || reachedNest) return;
            if (!chicken.jumping) {
                chicken.ducking = true;
                setTimeout(() => { chicken.ducking = false; }, 600);
            }
        }, {passive: false});

        window.addEventListener("keydown", (e) => {
            if (!gameRunning || reachedNest) return;
            if ((e.code === "Space" || e.code === "ArrowUp") && !chicken.jumping) {
                chicken.vy = -16;
                chicken.jumping = true;
                chicken.ducking = false;
            }
            if (e.code === "ArrowDown" && !chicken.jumping) {
                chicken.ducking = true;
                setTimeout(() => { chicken.ducking = false; }, 600);
            }
        });

        function update() {
            if (!gameRunning || reachedNest) return;

            distance += currentScenario.speed / 10;
            updateHUD();

            if (distance >= level * 100) {
                gameRunning = false;
                reachedNest = true;
                setTimeout(() => {
                    level++;
                    document.querySelector("#ui-overlay h1").innerText = "🎉 ¡Llegaste al Nido!";
                    document.querySelector("#ui-overlay p").innerText = `¡Bien hecho, ${aliasInput.value}! Prepárate para el siguiente nivel.`;
                    startBtn.innerText = "SIGUIENTE NIVEL";
                    overlay.style.display = "flex";
                }, 1000);
                return;
            }

            const groundY = canvas.height - 150;

            chicken.vy += 0.8;
            chicken.y += chicken.vy;

            let currentHeight = chicken.ducking ? 40 : 60;
            let currentWidth = chicken.ducking ? 70 : 60;
            chicken.height = currentHeight;
            chicken.width = currentWidth;

            if (chicken.y > groundY - chicken.height) {
                chicken.y = groundY - chicken.height;
                chicken.vy = 0;
                chicken.jumping = false;
            }

            if (Math.random() < 0.012) {
                let isBranch = Math.random() > 0.5;
                obstacles.push({
                    x: canvas.width,
                    y: isBranch ? groundY - 110 : groundY - 50,
                    width: isBranch ? 40 : 50,
                    height: isBranch ? 30 : 50,
                    type: isBranch ? "branch" : "log"
                });
            }

            fox.x += (chicken.x - fox.x - 180) * 0.03;
            fox.y = groundY - fox.height;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= currentScenario.speed;

                if (
                    chicken.x < obstacles[i].x + obstacles[i].width - 10 &&
                    chicken.x + chicken.width - 10 > obstacles[i].x &&
                    chicken.y < obstacles[i].y + obstacles[i].height - 10 &&
                    chicken.y + chicken.height > obstacles[i].y + 10
                ) {
                    gameRunning = false;
                    overlay.style.display = "flex";
                    document.querySelector("#ui-overlay h1").innerText = "💥 ¡Te alcanzó el zorro!";
                    startBtn.innerText = "VOLVER A INTENTAR";
                }

                if (
                    fox.x < obstacles[i].x + obstacles[i].width &&
                    fox.x + fox.width > obstacles[i].x &&
                    fox.y < obstacles[i].y + obstacles[i].height &&
                    fox.y + fox.height > obstacles[i].y
                ) {
                    obstacles.splice(i, 1);
                    continue;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            if (
                chicken.x < fox.x + fox.width - 20 &&
                chicken.x + chicken.width > fox.x + 20 &&
                chicken.y < fox.y + fox.height &&
                chicken.y + chicken.height > fox.y
            ) {
                gameRunning = false;
                overlay.style.display = "flex";
                document.querySelector("#ui-overlay h1").innerText = "💥 ¡Te alcanzó el zorro!";
                startBtn.innerText = "VOLVER A INTENTAR";
            }
        }

        function draw() {
            ctx.fillStyle = currentScenario.sky;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height - 150;

            ctx.fillStyle = currentScenario.ground;
            ctx.fillRect(0, groundY, canvas.width, 30);
            ctx.fillStyle = currentScenario.dirt;
            ctx.fillRect(0, groundY + 30, canvas.width, 120);

            obstacles.forEach(obs => {
                if (obs.type === "branch") {
                    ctx.fillStyle = "#5c4033";
                    ctx.fillRect(obs.x, obs.y, 10, obs.height);
                    ctx.fillRect(obs.x + 10, obs.y + 10, 30, 10);
                } else {
                    ctx.fillStyle = "#8B4513";
                    ctx.beginPath();
                    ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 10);
                    ctx.fill();
                }
            });

            ctx.fillStyle = "#ffcccc";
            ctx.beginPath();
            let renderY = chicken.ducking ? chicken.y + 20 : chicken.y;
            let renderH = chicken.ducking ? 40 : 60;
            let bob = chicken.jumping ? 0 : Math.sin(chicken.animFrame) * 5;
            ctx.roundRect(chicken.x, renderY + bob, chicken.width, renderH, 20);
            ctx.fill();

            ctx.fillStyle = "#FFA500";
            let beakOffsetY = chicken.ducking ? 25 : 35;
            ctx.beginPath();
            ctx.moveTo(chicken.x + chicken.width, renderY + bob + beakOffsetY);
            ctx.lineTo(chicken.x + chicken.width + 15, renderY + bob + beakOffsetY + 5);
            ctx.lineTo(chicken.x + chicken.width, renderY + bob + beakOffsetY + 10);
            ctx.fill();

            ctx.fillStyle = "black";
            let eyeOffset = chicken.ducking ? 10 : 15;
            ctx.beginPath();
            ctx.arc(chicken.x + chicken.width - 20, renderY + bob + eyeOffset, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(chicken.x + 30, renderY + bob + 5, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = "#ffffcc";
            let wingY = chicken.ducking ? chicken.y + 25 : chicken.y + 30;
            ctx.beginPath();
            ctx.ellipse(chicken.x + 25, wingY + bob, 15, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            let eggY = chicken.ducking ? chicken.y + 5 : chicken.y - 10;
            ctx.beginPath();
            ctx.ellipse(chicken.x + 20, eggY + bob, 12, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#D43D1A";
            ctx.beginPath();
            ctx.roundRect(fox.x, fox.y, fox.width, fox.height, 10);
            ctx.fill();
            ctx.fillStyle = "#FFA800";
            ctx.fillRect(fox.x + 50, fox.y + 20, 15, 10);
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(fox.x + 20, fox.y + 15, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(fox.x + 22, fox.y + 15, 2, 0, Math.PI * 2);
            ctx.fill();

            if (reachedNest) {
                gameRunning = false;
                ctx.fillStyle = "#A597E6";
                ctx.beginPath();
                ctx.arc(canvas.width - 150, groundY + 15, 50, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#E0D8F9";
                ctx.beginPath();
                ctx.ellipse(canvas.width - 150, groundY + 20, 40, 25, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
