<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Corre Gallina! Protege el Huevo</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas {
            display: block;
            background: #87CEEB;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Pantalla de inicio / Menú superpuesto */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 26, 46, 0.85);
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p {
            font-size: 1.1rem;
            max-width: 400px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* Controles táctiles en pantalla */
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 5;
            pointer-events: none;
        }
        .ctrl-btn {
            pointer-events: auto;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid white;
            border-radius: 50%;
            font-size: 1.8rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        /* Barra superior de estado */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Interfaz superior -->
        <div id="hud">
            <div class="hud-box" id="level-text">Nivel: 1 - Granja</div>
            <div class="hud-box" id="score-text">Maíz: 0 / 3</div>
        </div>

        <!-- Pantalla de Inicio / Menú -->
        <div id="ui-overlay">
            <h1>🐔 ¡Corre Gallina!</h1>
            <p>¡Ayuda a la gallina a correr con su preciado huevo hasta el nido! Salta obstáculos, agáchate bajo ramas y recolecta maíz para lanzar trampa cósmicas al zorro hambriento.</p>
            <button class="btn" id="start-btn">¡JUGAR HORA!</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Botones táctiles inferiores -->
        <div id="controls">
            <div class="ctrl-btn" id="btn-down">⬇️</div>
            <div class="ctrl-btn" id="btn-up">⬆️</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const overlay = document.getElementById("ui-overlay");
        const startBtn = document.getElementById("start-btn");
        const levelText = document.getElementById("level-text");
        const scoreText = document.getElementById("score-text");

        // Ajustar pantalla completa real de forma dinámica
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Estado del juego
        let gameRunning = false;
        let score = 0;
        let level = 1;

        // Entidades del juego
        let chicken = {
            x: 80,
            y: 0,
            width: 50,
            height: 50,
            vy: 0,
            jumping: false,
            ducking: false,
            color: "white"
        };

        let obstacles = [];
        let cornItems = [];
        let gameSpeed = 5;
        let frameCount = 0;

        function resetGame() {
            score = 0;
            level = 1;
            gameSpeed = 5;
            obstacles = [];
            cornItems = [];
            updateHUD();
        }

        function updateHUD() {
            levelText.innerText = `Nivel: ${level} - Granja`;
            scoreText.innerText = `Maíz: ${score} / 3`;
        }

        // Iniciar juego al hacer clic en el botón
        startBtn.addEventListener("click", () => {
            overlay.style.display = "none";
            resetGame();
            gameRunning = true;
        });

        // Controles táctiles y teclado
        document.getElementById("btn-up").addEventListener("click", () => {
            if (!gameRunning) return;
            if (!chicken.jumping) {
                chicken.vy = -14;
                chicken.jumping = true;
                chicken.ducking = false;
            }
        });

        document.getElementById("btn-down").addEventListener("click", () => {
            if (!gameRunning) return;
            if (!chicken.jumping) {
                chicken.ducking = true;
                setTimeout(() => { chicken.ducking = false; }, 600);
            }
        });

        window.addEventListener("keydown", (e) => {
            if (!gameRunning) return;
            if ((e.code === "Space" || e.code === "ArrowUp") && !chicken.jumping) {
                chicken.vy = -14;
                chicken.jumping = true;
                chicken.ducking = false;
            }
            if (e.code === "ArrowDown" && !chicken.jumping) {
                chicken.ducking = true;
                setTimeout(() => { chicken.ducking = false; }, 600);
            }
        });

        function update() {
            if (!gameRunning) return;

            const groundY = canvas.height - 120;

            // Física de la gallina (Salto y gravedad)
            chicken.vy += 0.6;
            chicken.y += chicken.vy;

            let currentHeight = chicken.ducking ? 25 : 50;
            let currentWidth = chicken.ducking ? 60 : 50;
            chicken.height = currentHeight;
            chicken.width = currentWidth;

            if (chicken.y > groundY - chicken.height) {
                chicken.y = groundY - chicken.height;
                chicken.vy = 0;
                chicken.jumping = false;
            }

            // Generar obstáculos (ramas o zorros)
            frameCount++;
            if (frameCount % 100 === 0) {
                let isBranch = Math.random() > 0.5;
                obstacles.push({
                    x: canvas.width,
                    y: isBranch ? groundY - 90 : groundY - 50,
                    width: 40,
                    height: isBranch ? 30 : 50,
                    type: isBranch ? "branch" : "fox"
                });
            }

            // Generar maíz
            if (frameCount % 150 === 0) {
                cornItems.push({
                    x: canvas.width,
                    y: groundY - 140,
                    width: 25,
                    height: 25
                });
            }

            // Mover obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;
                
                // Colisión básica con obstáculos
                if (
                    chicken.x < obstacles[i].x + obstacles[i].width &&
                    chicken.x + chicken.width > obstacles[i].x &&
                    chicken.y < obstacles[i].y + obstacles[i].height &&
                    chicken.y + chicken.height > obstacles[i].y
                ) {
                    // Game Over o choque
                    gameRunning = false;
                    overlay.style.display = "flex";
                    document.querySelector("#ui-overlay h1").innerText = "💥 ¡Oh no, te atrapó el zorro!";
                    startBtn.innerText = "VOLVER A INTENTAR";
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Mover maíz
            for (let i = cornItems.length - 1; i >= 0; i--) {
                cornItems[i].x -= gameSpeed;

                // Colisión con maíz
                if (
                    chicken.x < cornItems[i].x + cornItems[i].width &&
                    chicken.x + chicken.width > cornItems[i].x &&
                    chicken.y < cornItems[i].y + cornItems[i].height &&
                    chicken.y + chicken.height > cornItems[i].y
                ) {
                    cornItems.splice(i, 1);
                    score++;
                    updateHUD();

                    if (score >= 3) {
                        level++;
                        score = 0;
                        gameSpeed += 1.5;
                        updateHUD();
                    }
                }

                if (cornItems[i].x + cornItems[i].width < 0) {
                    cornItems.splice(i, 1);
                }
            }
        }

        function draw() {
            // Limpiar lienzo con el fondo del cielo
            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height - 120;

            // Dibujar suelo de la granja
            ctx.fillStyle = "#55a630";
            ctx.fillRect(0, groundY, canvas.width, 20);
            ctx.fillStyle = "#8B4513";
            ctx.fillRect(0, groundY + 20, canvas.width, 100);

            // Dibujar Obstáculos (Ramas / Zorro)
            obstacles.forEach(obs => {
                if (obs.type === "branch") {
                    ctx.fillStyle = "#5c4033";
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                } else {
                    // Zorro
                    ctx.fillStyle = "#d94e1f";
                    ctx.beginPath();
                    ctx.arc(obs.x + 20, obs.y + 25, 22, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Dibujar Maíz
            cornItems.forEach(corn => {
                ctx.fillStyle = "#ffd700";
                ctx.beginPath();
                ctx.arc(corn.x + 12, corn.y + 12, 10, 0, Math.PI * 2);
                ctx.fill();
            });

            // Dibujar Gallina
            ctx.fillStyle = chicken.color;
            ctx.beginPath();
            let renderY = chicken.ducking ? chicken.y + 15 : chicken.y;
            let renderH = chicken.ducking ? 30 : 50;
            ctx.roundRect(chicken.x, renderY, chicken.width, renderH, 15);
            ctx.fill();

            // Ojo de la gallina
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(chicken.x + (chicken.width - 12), renderY + 12, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Iniciar el ciclo de renderizado inmediatamente
        loop();
    </script>
</body>
</html>
